name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs‑on: ubuntu‑latest
    steps:
      ‑ uses: actions/checkout@v4

      ‑ name: Build APK via official buildozer docker
        uses: kivy/buildozer‑action@main
        with:
          buildozer‑cmd: android debug

      ‑ name: Upload‑APK
        uses: actions/upload‑artifact@v4
        with:
          name: apk‑build
          path: bin/*.apk
