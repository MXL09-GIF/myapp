name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: Buildozer编译APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: "3.10"
          buildozer-cmd: buildozer -v android debug

      - name: 上传APK成品
        uses: actions/upload-artifact@v4
        with:
          name: apk成品
          path: ./bin/*.apk
